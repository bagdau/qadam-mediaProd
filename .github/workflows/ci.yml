name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: qadam, POSTGRES_PASSWORD: testpw, POSTGRES_DB: qadam_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qadam" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://qadam:testpw@127.0.0.1:5432/qadam_test
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app devtools --select E,F,I,UP,B,ASYNC --ignore E501,B008,UP047
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Production images build
        run: |
          mkdir -p secrets && for f in postgres_password redis_password secret_key encryption_keys tiktok_client_secret bootstrap_admin_password; do echo ci > secrets/$f; done
          printf 'SERVER_NAME=ci.example\nPUBLIC_URL=https://ci.example\nTIKTOK_REDIRECT_URI=https://ci.example/oauth/tiktok/callback\nTIKTOK_CLIENT_KEY=ci\n' > .env
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml build
